vm:
  name: mph-smoke
  disk: 10G
  ram: 2G
  cpu: 1
  image: bionic
model: unsloth/granite-4.0-350m-IQ4_XS
allowed_commands:
  - coreUtils
  - sudo 
  - apt 
llm:
  temperature: 0.0
  top_p: 0.95
  top_k: 40
  tool_choice: auto
agent:
  max_iterations: 10
  chat_timeout: 300s
  total_timeout: 30m
prompt: |
  Inside the Multipass VM, ensure apt is working by doing the following:
  1. run apt --help and ensure it contains a help string
  2. run sudo apt upgrade 
  3. run sudo apt update
  Output a summary of the test the results.
