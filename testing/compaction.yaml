# configuration which triggers an early compaction step. 
# for speed, we use a smaller model; its not too great at tool calls after compaction, but the point of this test is 
# that we get a compaction. Larger models will perform better. 

vm:
  name: mph-compact
  disk: 10G
  ram: 2G
  cpu: 1
  image: bionic
model: unsloth/Qwen3-0.6B-Q8_0
llm:
  temperature: 0.0
  tool_choice: auto
  context_window: 4096
agent:
  max_iterations: 5
  chat_timeout: 300s
  total_timeout: 30m
compaction:
  enabled: true
  threshold: 0.51
  max_summary_tokens: 512
  min_messages: 6
  max_attempts: 3
prompt: |
  Inside the Multipass VM, do the following:
  1. Run uname -a and note the kernel release field.
  2. Write that release string into ./tmp/steps.txt.
  3. Append the output of hostname as a second line in ./tmp/steps.txt.
  4. Append the output of whoami as a third line in ./tmp/steps.txt.
  5. Read back ./tmp/steps.txt and report all three lines.
  Summarise the results.
