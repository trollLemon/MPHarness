global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  - job_name: "otel-collector-self"
    scrape_interval: 5s
    static_configs:
      - targets: ["otel-collector:8888"]
    metrics_path: /metrics

  - job_name: "tempo"
    scrape_interval: 10s
    static_configs:
      - targets: ["tempo:3200"]
