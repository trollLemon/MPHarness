# Attach Ubuntu Pro using a secret from the freedesktop Secret Service.
# Provision first with:
#   printf '%s' "$PRO_TOKEN" | secret-tool store --label='mph: PRO_TOKEN' service mph username PRO_TOKEN
vm:
  name: mph-secrets-keyring
  disk: 10G
  ram: 2G
  cpu: 1
  image: bionic
model: unsloth/granite-4.0-350m-IQ4_XS
allowed_commands:
  - sudo
  - pro
llm:
  temperature: 0.0
  top_p: 0.95
  top_k: 40
  tool_choice: auto
agent:
  max_iterations: 10
  chat_timeout: 300s
  total_timeout: 30m
secrets:
  source: keyring
  service: mph
prompt: |
  Inside the Multipass VM, attach the Ubuntu Pro subscription by running:
    sudo pro attach %{PRO_TOKEN}
  Use the placeholder exactly as written. Then run `pro status` and output
  a summary of the result.
