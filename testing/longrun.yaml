run:
  name: long-run-test-3
vm:
  name: mph-longrun-3
  disk: 10G
  ram: 2G
  cpu: 1
  image: bionic
model: unsloth/granite-4.0-h-1b
allowed_commands:
  - ls
  - cat
  - uname
  - wc
  - head
  - tail
  - grep
  - sort
  - uniq
  - find
  - du
  - df
  - stat
  - file
  - date
  - whoami
llm:
  tool_choice: auto
agent:
  max_iterations: 60
  chat_timeout: 60m
  total_timeout: 90m

compaction:
  enabled: true
  threshold: 0.91
  max_summary_tokens: 900
  min_messages: 6
  max_attempts: 3  

output:
  enabled: true
  mode: always
  inline_max_size: 0
  max_command_size: 64MiB
  max_total_size: 512MiB
  search_max_matches: 200

prompt: |
  Inside the Multipass VM, please do the following.
  1. Run `uname -a`.
  2. Run `cat /etc/os-release`.
  3. Run `ls /etc`.
  4. Run `ls /etc/apt`.
  5. Run `cat /etc/hostname`.
  6. Run `cat /etc/passwd` and note how many lines it has.
  7. Run `cat /etc/group` and note how many lines it has.
  8. Run `ls /etc/ssl/certs`.
  9. Run `ls /usr/bin`.
  10. Run `ls /usr/share`.
  11. Run `cat /proc/uptime`.
  12. Run `cat /proc/cpuinfo`.
  13. Run `cat /proc/meminfo`.
  14. Run `cat /proc/version`.
  15. Run `df -h /`.
  16. Run `du -sh /etc`.
  17. Run `find /etc -maxdepth 1 -name '*.conf'`.
  18. Run `cat /etc/adduser.conf`.
  19. Run `cat /etc/login.defs`.
  20. Run `cat /etc/environment`.
  21. Run `cat /etc/fstab`.
  22. Run `cat /etc/hosts`.
  23. Run `cat /etc/resolv.conf`.
  24. Run `cat /etc/timezone`.
  25. Run `cat /etc/ld.so.conf`.
  26. Run `cat /etc/bash.bashrc`.
  27. Run `ls /var/log`.
  28. Run `cat /proc/mounts`.
  29. Run `cat /proc/cmdline`.
  30. Run `ls /tmp`.

  When every item is done, state that the checklist is complete and give a
  one-paragraph summary of the machine.
otel:
  enabled: true
  endpoint: localhost:4317
  service_name: mph-longrun-3
  resource_attributes:
    environment: dev
