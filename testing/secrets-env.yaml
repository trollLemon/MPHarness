# Attach Ubuntu Pro using a secret from the environment.
# Run with: PRO_TOKEN=<token> ./bin/mph testing/secrets-env.yaml
vm:
  name: mph-secrets-env
  disk: 10G
  ram: 2G
  cpu: 1
  image: noble
model: unsloth/granite-4.0-350m-IQ4_XS
allowed_commands:
  - sudo
  - pro
llm:
  temperature: 0.0
  top_p: 0.95
  top_k: 40
  tool_choice: auto
agent:
  max_iterations: 10
  chat_timeout: 300s
  total_timeout: 30m
secrets:
  source: env
prompt: |
  Inside the VM, attach the Ubuntu Pro subscription by running:
    sudo pro attach %{PRO_TOKEN}
  Use the placeholder exactly as written. Then run `pro status` and output
  a summary of the result.
