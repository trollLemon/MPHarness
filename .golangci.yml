run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable-all: true
  fast: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

linters-settings:
  gosec:
    excludes: []